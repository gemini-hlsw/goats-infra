name: Notify Slack
description: >
  Post one message to the GOATS Slack channel: a bold one-line title, the
  key facts as two-column fields and a row of link buttons ending with
  "View run". A failure also mentions whoever looks after the conda
  pipeline. Does nothing when the webhook is empty (e.g. a fork without the
  secret), and a message Slack refuses only leaves a warning. GOATSbot has
  no interactivity configured, so Slack also warns when someone clicks a
  button; the link still opens.

inputs:
  webhook:
    description: Incoming webhook URL (secrets.SLACK_WEBHOOK_URL)
    required: true
  status:
    description: success, failure or info; sets the icon, the mention and the "View run" color
    required: true
  title:
    description: One short line, shown in bold
    required: true
  fields:
    description: One "Label=value" per line, shown as two-column fields (Slack mrkdwn)
    required: false
    default: ""
  primary:
    description: Optional highlighted first button, as "Label=url"
    required: false
    default: ""
  links:
    description: Optional extra buttons, one "Label=url" per line
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post to Slack
      if: inputs.webhook != ''
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        FIELDS: ${{ inputs.fields }}
        PRIMARY: ${{ inputs.primary }}
        LINKS: ${{ inputs.links }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        case "$STATUS" in
          success) icon="✅" mention="" ;;
          failure) icon="❌" mention="<@U0538PY7RL0> " ;;
          *) icon="📦" mention="" ;;
        esac
        # "Label=value" lines; only the first "=" splits, so URLs keep theirs.
        pairs() { jq -R -s 'split("\n") | map(select(length > 0) | index("=") as $i | {label: .[:$i], value: .[$i + 1:]})'; }
        fields=$(printf '%s' "$FIELDS" | pairs)
        buttons=$({
          printf '%s' "$PRIMARY" | pairs | jq 'map(. + {style: "primary"})'
          printf '%s' "$LINKS" | pairs
          jq -n --arg url "$RUN_URL" --arg status "$STATUS" \
            '[{label: "View run", value: $url} + (if $status == "failure" then {style: "danger"} else {} end)]'
        } | jq -s 'add')
        payload=$(jq -n \
          --arg text "$icon $TITLE" \
          --arg head "$icon $mention*$TITLE*" \
          --argjson fields "$fields" \
          --argjson buttons "$buttons" '
          {
            text: $text,
            blocks: (
              [{type: "section", text: {type: "mrkdwn", text: $head}}]
              + (if ($fields | length) > 0
                 then [{type: "section", fields: ($fields | map({type: "mrkdwn", text: ("*\(.label)*\n\(.value)")}))}]
                 else [] end)
              + [{type: "actions", elements: ($buttons | to_entries | map(
                  {type: "button", text: {type: "plain_text", text: .value.label, emoji: true},
                   url: .value.value, action_id: "link-\(.key)"}
                  + (if .value.style then {style: .value.style} else {} end)))}]
            )
          }')
        curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$WEBHOOK" \
          || echo "::warning::Slack did not accept the message."
