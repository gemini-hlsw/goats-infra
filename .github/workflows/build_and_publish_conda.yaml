name: Build and publish Conda packages

# Builds the GOATS recipe, installs and sets it up, and publishes it to
# conda-test, the only source for promote_conda_package.yaml. Production
# (conda) only gets final versions, by promotion.
#
# Only release candidates and final releases are packaged, and they pin a
# stable gpp-client (e.g. ==26.10.6), which talks to GPP production. devN
# GOATS are not built here: developers install GOATS from PyPI with uv.
on:
  workflow_dispatch:

env:
  CHANNEL_ROOT: https://gemini-hlsw.github.io/goats-infra
  ASTROCONDA: http://astroconda.gemini.edu/public
  # astroconda times out now and then; let conda retry a little. When a
  # runner cannot reach it at all, the reachability checks below fail in a
  # few minutes instead of letting conda retry for an hour.
  CONDA_REMOTE_MAX_RETRIES: "3"
  CONDA_REMOTE_BACKOFF_FACTOR: "2"
  CONDA_REMOTE_CONNECT_TIMEOUT_SECS: "15"
  CONDA_REMOTE_READ_TIMEOUT_SECS: "120"

# setup-miniconda turns on `set -eo pipefail` in login shells, and on Ubuntu
# ~/.bash_logout then turns any explicit `exit` into status 1. Scripts that
# succeed must end on their last command, never on `exit 0`.
jobs:
  verify:
    name: Verify the recipe
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      source: ${{ steps.metadata.outputs.source }}
      gpp_client: ${{ steps.metadata.outputs.gpp_client }}
      build_channels: ${{ steps.release.outputs.build_channels }}
      install_channels: ${{ steps.release.outputs.install_channels }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y yq jq
          pip install jinja2-cli

      - name: Render meta.yaml and extract info
        id: metadata
        run: |
          jinja2 goats-feedstock/recipe/meta.yaml > ${{ runner.temp }}/rendered.yaml
          name=$(yq -r '.package.name' ${{ runner.temp }}/rendered.yaml)
          version=$(yq -r '.package.version' ${{ runner.temp }}/rendered.yaml)
          build=$(yq -r '.build.number' ${{ runner.temp }}/rendered.yaml)
          source=$(yq -r '.source.url' ${{ runner.temp }}/rendered.yaml)
          sha256=$(yq -r '.source.sha256' ${{ runner.temp }}/rendered.yaml)
          gpp_client=$(yq -r '.requirements.run[] | select(startswith("gpp-client ")) | sub("^gpp-client *==";"")' ${{ runner.temp }}/rendered.yaml)

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "gpp_client=$gpp_client" >> "$GITHUB_OUTPUT"
          echo "goats $version (build $build) pins gpp-client $gpp_client"

      # R1: only release candidates and final releases, pinned to a stable
      # gpp-client. Build channels follow strict priority; install channels
      # follow the order users and testers configure: our channels, then
      # astroconda, then conda-forge.
      - name: Check the version and the gpp-client pin
        id: release
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          GPP_CLIENT: ${{ steps.metadata.outputs.gpp_client }}
        run: |
          if [[ "$VERSION" == *dev* ]]; then
            echo "::error::goats $VERSION is a devN version. Only release candidates and final releases are built and published."
            exit 1
          fi
          if [[ ! "$GPP_CLIENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::goats $VERSION must pin a stable gpp-client with ==, found '$GPP_CLIENT'. A gpp-client .devN talks to GPP development."
            exit 1
          fi
          ours="$CHANNEL_ROOT/conda-test $CHANNEL_ROOT/conda"
          {
            echo "build_channels=$ours conda-forge $ASTROCONDA"
            echo "install_channels=$ours $ASTROCONDA conda-forge"
          } >> "$GITHUB_OUTPUT"
          echo "goats $VERSION goes to conda-test."

      # R2: build only from a published (non-draft) GOATS release.
      - name: Check the GOATS release is published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          draft=$(gh release view "$VERSION" -R gemini-hlsw/goats --json isDraft -q .isDraft) || {
            echo "::error::GOATS release $VERSION does not exist."
            exit 1
          }
          if [ "$draft" != "false" ]; then
            echo "::error::GOATS release $VERSION is still a draft. Publish it first."
            exit 1
          fi

      - name: Check the source checksum and dependencies
        env:
          SOURCE: ${{ steps.metadata.outputs.source }}
          SHA256: ${{ steps.metadata.outputs.sha256 }}
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/source.tar.gz" "$SOURCE"
          echo "$SHA256  $RUNNER_TEMP/source.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -O --wildcards '*/pyproject.toml' > "$RUNNER_TEMP/pyproject.toml"
          python3 sync_deps.py --check --pyproject-path "$RUNNER_TEMP/pyproject.toml"

      # R5: gpp-client never goes in our channels; there it would hide
      # conda-forge's releases under strict channel priority.
      - name: Check our channels carry no gpp-client
        run: |
          for channel in conda-test conda; do
            for subdir in noarch linux-64 osx-64; do
              url="$CHANNEL_ROOT/$channel/$subdir/repodata.json"
              if curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/repodata.json" 2>/dev/null \
                && jq -e '[.packages, ."packages.conda"] | map(.[]?) | any(.name == "gpp-client")' "$RUNNER_TEMP/repodata.json" >/dev/null; then
                echo "::error::$channel/$subdir carries gpp-client. Remove it: gpp-client comes from conda-forge."
                exit 1
              fi
            done
          done

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: "true"

      # A new gpp-client takes a while to show up in the conda-forge index
      # after its feedstock PR merges. Wait for it instead of failing the
      # build.
      - name: Wait for gpp-client on conda-forge
        env:
          GPP_CLIENT: ${{ steps.metadata.outputs.gpp_client }}
          CONDA_LOCAL_REPODATA_TTL: "0"
        run: |
          attempt=1
          until conda search --override-channels -c conda-forge "gpp-client==$GPP_CLIENT" >/dev/null 2>&1; do
            if [ "$attempt" -eq 20 ]; then
              echo "::error::gpp-client $GPP_CLIENT never showed up on conda-forge."
              exit 1
            fi
            echo "gpp-client $GPP_CLIENT not on conda-forge yet ($attempt/20), waiting 3 minutes."
            attempt=$((attempt + 1))
            sleep 180
          done
          echo "gpp-client $GPP_CLIENT is available on conda-forge."

  build:
    name: Conda build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    needs: verify
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          auto-activate: true
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Install build tools
        # conda-build must live in the base env: `conda build` is resolved as a
        # plugin of the base conda, not of the activated test env.
        run: |
          conda install -y -n base conda-build conda-index

      # Some runners cannot reach astroconda (http only) for a long while.
      # Re-running the failed job usually lands on one that can.
      - name: Check astroconda is reachable
        env:
          SUBDIR: ${{ runner.os == 'macOS' && 'osx-64' || 'linux-64' }}
        run: |
          curl -fsS -o /dev/null --connect-timeout 10 --retry 6 --retry-delay 20 --retry-all-errors \
            "$ASTROCONDA/$SUBDIR/repodata.json" || {
            echo "::error::This runner cannot reach astroconda. Re-run the failed jobs to get another runner."
            exit 1
          }

      - name: Create output folder
        run: mkdir -p ${{ runner.temp }}/conda-artifacts

      # goats-infra channels go before conda-forge: with strict channel
      # priority they must shadow conda-forge for the packages we override
      # (e.g. ipyvuedraggable). A failure that only comes from an unreachable
      # channel is retried.
      - name: Build recipe
        env:
          CHANNELS: ${{ needs.verify.outputs.build_channels }}
        run: |
          set -o pipefail
          channel_args=()
          for channel in $CHANNELS; do channel_args+=(--channel "$channel"); done
          attempt=1
          until conda build goats-feedstock/recipe \
              --output-folder ${{ runner.temp }}/conda-artifacts \
              "${channel_args[@]}" \
              --override-channels \
              --no-anaconda-upload 2>&1 | tee "$RUNNER_TEMP/build.log"; do
            if [ "$attempt" -eq 3 ] || ! grep -qE "Download error|Timeout was reached|CondaHTTPError|Could not resolve host|Connection reset" "$RUNNER_TEMP/build.log"; then
              exit 1
            fi
            echo "::warning::A channel could not be reached, retrying the build ($attempt/3)."
            attempt=$((attempt + 1))
            sleep 60
          done

      - name: Upload built artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.build }}
          overwrite: true
          path: ${{ runner.temp }}/conda-artifacts

  # R3: install the built package the way users and testers do (flexible
  # priority, their channel order) and run GOATS setup before publishing.
  test-install:
    name: Install and run (${{ matrix.os }})
    needs: [verify, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.build }}
          path: ${{ runner.temp }}/local-channel

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Index the built packages as a local channel
        run: |
          conda install -y -n base conda-index
          conda run -n base python -m conda_index "$RUNNER_TEMP/local-channel"

      - name: Check astroconda is reachable
        env:
          SUBDIR: ${{ runner.os == 'macOS' && 'osx-64' || 'linux-64' }}
        run: |
          curl -fsS -o /dev/null --connect-timeout 10 --retry 6 --retry-delay 20 --retry-all-errors \
            "$ASTROCONDA/$SUBDIR/repodata.json" || {
            echo "::error::This runner cannot reach astroconda. Re-run the failed jobs to get another runner."
            exit 1
          }

      - name: Install GOATS
        env:
          CHANNELS: ${{ needs.verify.outputs.install_channels }}
          VERSION: ${{ needs.verify.outputs.version }}
          CONDA_CHANNEL_PRIORITY: flexible
        run: |
          channel_args=(-c "file://$RUNNER_TEMP/local-channel")
          for channel in $CHANNELS; do channel_args+=(-c "$channel"); done
          conda create -y -n goats-test --override-channels "${channel_args[@]}" \
            python=3.12 "goats==$VERSION"
          conda list -n goats-test "^(goats|gpp-client|jdaviz)$"

      - name: Check gpp-client targets GPP production
        run: |
          conda run -n goats-test python -c "from gpp_client.generated.package_environment import PACKAGE_ENVIRONMENT as env; print(env); assert env == 'PRODUCTION', env"

      - name: Run setup and Django checks
        env:
          DJANGO_SUPERUSER_PASSWORD: changeme
        run: |
          cd "$RUNNER_TEMP"
          conda run -n goats-test goats install --headless-superuser
          conda run -n goats-test --cwd "$RUNNER_TEMP/GOATS" python manage.py check

  publish:
    needs: [verify, build, test-install]
    name: Publish to conda-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: conda-test
      cancel-in-progress: false
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/built
          merge-multiple: true

      - name: Publish
        uses: ./.github/actions/publish-channel
        with:
          channel: conda-test
          packages: ${{ runner.temp }}/built
          message: "Publish goats-${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.build }} (gpp-client ${{ needs.verify.outputs.gpp_client }})."
          token: ${{ github.token }}
