name: Test Conda Install

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Runs Sunday at midnight UTC.

jobs:
  build_conda_env:
    name: Install and run (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        # Test building on Mac Intel as well.
        os: [ubuntu-latest] # [ubuntu-latest, macos-13]
        python-version: ["3.12"]

    steps:
      - name: Install coreutils (macOS only)
        if: ${{ matrix.os == 'macos-13' }}
        run: brew install coreutils

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          channels: https://gemini-hlsw.github.io/goats-infra/conda, http://astroconda.gemini.edu/public, conda-forge
          channel-priority: flexible
          conda-remove-defaults: "true"
          show-channel-urls: true

      - name: Install GOATS from Conda channel
        run: conda install goats -y

