name: Test Conda Install

on:
  workflow_dispatch:
    inputs:
      channel:
        description: GOATS channel to install from
        required: true
        type: choice
        default: conda
        options:
          - conda
          - conda-test
      version:
        description: GOATS version to install, e.g. 26.10.1rc1 (empty for the latest)
        required: false
        type: string
  schedule:
    - cron: "0 0 * * 0" # Runs Sunday at midnight UTC.

env:
  # Scheduled runs have no inputs, so they test the latest release in conda.
  GOATS_CHANNEL: ${{ inputs.channel || 'conda' }}
  GOATS_VERSION: ${{ inputs.version }}

jobs:
  build_conda_env:
    name: Install and run (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        # Test building on Mac Intel as well.
        os: [ubuntu-latest, macos-15-intel]
        python-version: ["3.12"]

    steps:
      - name: Install coreutils (macOS only)
        if: ${{ matrix.os == 'macos-15-intel' }}
        run: brew install coreutils

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          channels: ${{ env.GOATS_CHANNEL == 'conda-test' && 'https://gemini-hlsw.github.io/goats-infra/conda-test, ' || '' }}https://gemini-hlsw.github.io/goats-infra/conda, http://astroconda.gemini.edu/public, conda-forge
          channel-priority: flexible
          conda-remove-defaults: "true"
          show-channel-urls: true

      - name: Install GOATS from Conda channel
        run: |
          conda install "goats${GOATS_VERSION:+==$GOATS_VERSION}" -y
          conda list "^(goats|gpp-client)$"

      - name: Check gpp-client targets GPP production
        run: |
          python -c "from gpp_client.generated.package_environment import PACKAGE_ENVIRONMENT as env; print(env); assert env == 'PRODUCTION'"

      - name: Run setup without prompts
        env:
          DJANGO_SUPERUSER_PASSWORD: changeme
        run: |
          # goats 26.4 and older, still the latest in conda, only know --ci.
          if goats install --help | grep -q -- "--headless-superuser"; then
            goats install --headless-superuser
          else
            goats install --ci
          fi

      - name: Send Slack success
        if: ${{ success() }}
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: GOATS Conda install from `${{ env.GOATS_CHANNEL }}` succeeded"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View run",
                      "emoji": true
                    },
                    "value": "view_run",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "action_id": "button-action"
                  },
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*OS:*\n`${{ matrix.os }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Architecture:*\n`${{ runner.arch }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Python Version:*\n`${{ matrix.python-version }}`"
                    },
                  ],
                }
              ]
            }


      - name: Send Slack failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: <@U05HU8PERA5> GOATS Conda install from `${{ env.GOATS_CHANNEL }}` failed"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View run",
                      "emoji": true
                    },
                    "value": "view_run",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "action_id": "button-action"
                  },
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*OS:*\n`${{ matrix.os }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Architecture:*\n`${{ runner.arch }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Python Version:*\n`${{ matrix.python-version }}`"
                    },
                  ],
                }
              ]
            }
