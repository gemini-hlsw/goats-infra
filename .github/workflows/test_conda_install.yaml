name: Test Conda Install

# Installs GOATS from a live channel the way users and testers do, and runs
# its setup. Runs by hand, every Sunday against conda, after each publish to
# conda-test (from build_and_publish_conda.yaml) and after each promotion to
# conda (from gh_pages.yaml).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: GOATS channel to install from
        required: true
        type: choice
        default: conda
        options:
          - conda
          - conda-test
      version:
        description: GOATS version to install, e.g. 26.11.0rc1 (empty for the latest)
        required: false
        type: string
  workflow_call:
    inputs:
      channel:
        description: conda or conda-test
        required: true
        type: string
      version:
        description: GOATS version to install (empty for the latest)
        required: false
        type: string
      notify:
        description: Post the result to Slack; off when the caller reports it
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 0 * * 0" # Runs Sunday at midnight UTC.

env:
  # Scheduled runs have no inputs, so they test the latest release in conda.
  GOATS_CHANNEL: ${{ inputs.channel || 'conda' }}
  GOATS_VERSION: ${{ inputs.version }}
  CHANNEL_ROOT: https://gemini-hlsw.github.io/goats-infra
  ASTROCONDA: http://astroconda.gemini.edu/public
  # astroconda times out now and then; let conda retry a little before the
  # install step's own retries take over.
  CONDA_REMOTE_MAX_RETRIES: "3"
  CONDA_REMOTE_BACKOFF_FACTOR: "2"
  CONDA_REMOTE_CONNECT_TIMEOUT_SECS: "15"
  CONDA_REMOTE_READ_TIMEOUT_SECS: "120"

# setup-miniconda turns on `set -eo pipefail` in login shells, and on Ubuntu
# ~/.bash_logout then turns any explicit `exit` into status 1. Scripts that
# succeed must end on their last command, never on `exit 0`.
jobs:
  build_conda_env:
    name: Install and run (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        # Test building on Mac Intel as well.
        os: [ubuntu-latest, macos-15-intel]
        python-version: ["3.12"]

    steps:
      # Only for the Slack action; the channels hold the packages.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          filter: blob:none

      - name: Install coreutils (macOS only)
        if: ${{ matrix.os == 'macos-15-intel' }}
        run: brew install coreutils

      # Right after a publish, GitHub Pages can take minutes to serve the new
      # index.
      - name: Wait for the channel to serve this version
        if: env.GOATS_VERSION != ''
        env:
          SUBDIR: ${{ runner.os == 'macOS' && 'osx-64' || 'linux-64' }}
        run: |
          url="$CHANNEL_ROOT/$GOATS_CHANNEL/$SUBDIR/repodata.json"
          attempt=1
          until curl -fsSL "$url" | jq -e --arg v "$GOATS_VERSION" '[.packages, ."packages.conda"] | map(.[]?) | any(.name == "goats" and .version == $v)' >/dev/null; do
            if [ "$attempt" -eq 30 ]; then
              echo "::error::$GOATS_CHANNEL never served goats $GOATS_VERSION for $SUBDIR."
              exit 1
            fi
            echo "goats $GOATS_VERSION is not in $GOATS_CHANNEL yet ($attempt/30), waiting 30 seconds."
            attempt=$((attempt + 1))
            sleep 30
          done

      # Only conda-forge here: this action cannot retry, so the channels that
      # time out are left to the install step, which can.
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
          show-channel-urls: true

      # Same channel order as the build's test-install job; keep them in sync.
      # A failure that only comes from an unreachable channel is retried.
      - name: Install GOATS from Conda channel
        env:
          CONDA_CHANNEL_PRIORITY: flexible
        run: |
          set -o pipefail
          case "$GOATS_CHANNEL" in
            conda-test) channels="conda-test conda" ;;
            *) channels="conda" ;;
          esac
          channel_args=()
          for channel in $channels; do channel_args+=(-c "$CHANNEL_ROOT/$channel"); done
          channel_args+=(-c "$ASTROCONDA" -c conda-forge)
          attempt=1
          until conda install -y --override-channels "${channel_args[@]}" \
              "python=${{ matrix.python-version }}" "goats${GOATS_VERSION:+==$GOATS_VERSION}" \
              2>&1 | tee "$RUNNER_TEMP/install.log"; do
            if [ "$attempt" -eq 3 ] || ! grep -qE "Download error|Timeout was reached|CondaHTTPError|Could not resolve host|Connection reset" "$RUNNER_TEMP/install.log"; then
              exit 1
            fi
            echo "::warning::A channel could not be reached, retrying the install ($attempt/3)."
            attempt=$((attempt + 1))
            sleep 60
          done
          conda list "^(goats|gpp-client)$"

      # Published GOATS only pin stable gpp-client releases, which talk to GPP
      # production (gpp-client ADR 0002).
      - name: Check gpp-client targets GPP production
        run: |
          python - <<'EOF'
          from importlib.metadata import version

          from gpp_client.generated.package_environment import PACKAGE_ENVIRONMENT as env

          print(f"gpp-client {version('gpp-client')}: {env}")
          assert env == "PRODUCTION", "expected PRODUCTION"
          EOF

      - name: Run setup without prompts
        env:
          DJANGO_SUPERUSER_PASSWORD: changeme
        run: |
          # goats 26.4 and older, still the latest in conda, only know --ci.
          # Click rejects an unknown option before printing help, so the exit
          # code tells. Grepping the help fails here: on GitHub Actions typer
          # colors it and splits option names with escape codes.
          if goats install --headless-superuser --help >/dev/null 2>&1; then
            goats install --headless-superuser
          else
            goats install --ci
          fi

      # notify only exists when called from another workflow. format() keeps
      # a missing input (null) apart from false: expressions coerce both to 0.
      - name: Write the report
        id: report
        if: ${{ !cancelled() && format('{0}', inputs.notify) != 'false' }}
        env:
          STATUS: ${{ job.status }}
        run: |
          # The version conda actually installed, which a run without one picks.
          version=$(conda list '^goats$' --json 2>/dev/null | jq -r '.[0].version // empty' || true)
          version=${version:-${GOATS_VERSION:-latest}}
          if [ "$STATUS" = success ]; then
            title="GOATS $version installs and sets up from $GOATS_CHANNEL"
          else
            title="GOATS $version failed to install or set up from $GOATS_CHANNEL"
          fi
          {
            echo "title=$title"
            printf 'fields<<EOF\nVersion=`%s`\nChannel=`%s`\nOS=`%s` (%s)\nPython=`%s`\nEOF\n' \
              "$version" "$GOATS_CHANNEL" "${{ matrix.os }}" "${{ runner.arch }}" "${{ matrix.python-version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Report to Slack
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: ${{ steps.report.outputs.title }}
          fields: ${{ steps.report.outputs.fields }}
