name: Promote Conda package to production

# Copies an already-built final release from the conda-test channel into the
# production channel and reindexes it -- the exact bytes that were tested are
# promoted, nothing is rebuilt. Our own dependencies the package needs (e.g.
# jdaviz for goats) are promoted with it. See promote.py. Production changes
# go through a reviewed PR to main.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name to promote (e.g. goats)
        required: true
        type: string
      version:
        description: Final version to promote (e.g. 26.11.0); rcN and devN are refused
        required: true
        type: string

jobs:
  promote:
    name: Promote ${{ inputs.package }}-${{ inputs.version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniforge-version: latest
          python-version: "3.12"
          auto-activate: true
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Install index tools
        run: |
          conda install -y conda-index

      # conda-test lives on its own branch.
      - name: Fetch the conda-test channel
        run: |
          mkdir -p "$RUNNER_TEMP/conda-test"
          git fetch --depth 1 origin conda-test
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/conda-test"

      # promote.py imports conda, which lives in the base environment.
      - name: Copy packages from conda-test to conda
        id: copy
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          conda run -n base python promote.py "$PACKAGE" "$VERSION" --source "$RUNNER_TEMP/conda-test" | tee "$RUNNER_TEMP/promoted.txt"
          {
            echo "files<<EOF"
            sort -u "$RUNNER_TEMP/promoted.txt" | sed 's/^/- `/; s/$/`/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Index Conda channel
        run: python -m conda_index --no-compact --channeldata docs/gh_pages/conda

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            docs/gh_pages/conda
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: promote-${{ inputs.package }}-${{ inputs.version }}
          title: Promote `${{ inputs.package }}-${{ inputs.version }}` to production.
          body: |
            This PR promotes a final release from the `conda-test` channel to the
            production `conda` channel. The artifacts are the exact files that
            were built, installed and tested there -- nothing was rebuilt.

            - **Package:** `${{ inputs.package }}`
            - **Version:** `${{ inputs.version }}`

            Files copied, including the dependencies it needs:
            ${{ steps.copy.outputs.files }}

            The production Conda index has been updated in `docs/gh_pages/conda/`.
            Merging redeploys GitHub Pages, which then installs this version from
            `conda` and reports the result to Slack.
          reviewers: miguelgomezgomez
          assignees: miguelgomezgomez
          commit-message: "Promote ${{ inputs.package }}-${{ inputs.version }} to conda."

      - name: Report to Slack
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status == 'success' && 'info' || 'failure' }}
          text: "${{ job.status == 'success' && format('{0}-{1} is ready for production. Review and merge {2}', inputs.package, inputs.version, steps.cpr.outputs.pull-request-url) || format('Promoting {0}-{1} to conda failed.', inputs.package, inputs.version) }}"
