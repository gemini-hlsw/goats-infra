name: Build and publish dependency Conda packages

on:
  workflow_dispatch:
    inputs:
      feedstock:
        description: Feedstock to build
        required: true
        type: choice
        options:
          - ipysplitpanes
          - ipygoldenlayout
          - ipyvuedraggable
          - ipypopout
          - stdatamodels
          - jdaviz
      channel:
        description: Target channel (test first, then promote)
        required: true
        type: choice
        default: conda-test
        options:
          - conda-test
          - conda

jobs:
  metadata:
    name: Parse metadata for workflow
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      source: ${{ steps.metadata.outputs.source }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y yq jq
          pip install jinja2-cli

      - name: Render meta.yaml and extract info
        id: metadata
        run: |
          jinja2 dependency-feedstocks/${{ inputs.feedstock }}-feedstock/recipe/meta.yaml > ${{ runner.temp }}/rendered.yaml
          name=$(yq -r '.package.name' ${{ runner.temp }}/rendered.yaml)
          version=$(yq -r '.package.version' ${{ runner.temp }}/rendered.yaml)
          build=$(yq -r '.build.number' ${{ runner.temp }}/rendered.yaml)
          source=$(yq -r '.source.url' ${{ runner.temp }}/rendered.yaml)

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

  build:
    # All dependency feedstocks are noarch: python, so a single Linux build
    # covers every platform.
    name: Conda build (noarch)
    runs-on: ubuntu-latest
    needs: metadata
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest
          python-version: "3.12"
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Install build tools
        # conda-build must live in the base env: `conda build` is resolved as a
        # plugin of the base conda, not of the activated test env.
        run: |
          conda install -y -n base conda-build

      - name: Create output folder
        run: mkdir -p ${{ runner.temp }}/conda-artifacts

      # The test channel is included so feedstocks that depend on each other
      # (e.g. jdaviz -> ipysplitpanes) can resolve packages published there
      # before they are promoted to the main channel.
      - name: Build recipe
        run: |
          conda build dependency-feedstocks/${{ inputs.feedstock }}-feedstock/recipe \
            --output-folder ${{ runner.temp }}/conda-artifacts \
            --channel conda-forge \
            --channel https://gemini-hlsw.github.io/goats-infra/conda-test \
            --channel https://gemini-hlsw.github.io/goats-infra/conda \
            --override-channels \
            --no-anaconda-upload

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noarch-${{ needs.metadata.outputs.name }}-${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.build }}
          overwrite: true
          path: ${{ runner.temp }}/conda-artifacts

  publish:
    needs: [build, metadata]
    name: Publish conda packages
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest
          python-version: "3.12"
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Install index tools
        run: |
          conda install -y conda-index

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Move built Conda packages into Conda channel
        run: |
          mkdir -p docs/gh_pages/${{ inputs.channel }}/noarch
          cp ${{ runner.temp }}/noarch/*.conda docs/gh_pages/${{ inputs.channel }}/noarch
          ls -Rl docs/gh_pages/${{ inputs.channel }}

      - name: Index Conda channel
        run: python -m conda_index --no-compact --channeldata docs/gh_pages/${{ inputs.channel }}

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            docs/gh_pages/${{ inputs.channel }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: ${{ needs.metadata.outputs.name }}-${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.build }}-${{ inputs.channel }}
          title: Publish `${{ needs.metadata.outputs.name }}-${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.build }}` to `${{ inputs.channel }}`.
          body: |
            This PR publishes a new Conda package version to the `${{ inputs.channel }}` channel.

            - **Package:** `${{ needs.metadata.outputs.name }}`
            - **Version:** `${{ needs.metadata.outputs.version }}`
            - **Build number:** `${{ needs.metadata.outputs.build }}`
            - **Source URL:** `${{ needs.metadata.outputs.source }}`

            The following platforms were built and included:
            - `noarch`

            The Conda index has been updated and committed to `docs/gh_pages/${{ inputs.channel }}/`.
          reviewers: davner
          assignees: davner
          commit-message: "Publish ${{ needs.metadata.outputs.name }}-${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.build }} to ${{ inputs.channel }}."
