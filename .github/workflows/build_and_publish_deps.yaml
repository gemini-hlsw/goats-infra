name: Build and publish dependency Conda packages

# Builds every recipe in dependency-feedstocks/recipes/ that is not already
# published, in dependency order (rattler-build sorts them), and publishes the
# new packages to conda-test, where both GOATS tracks find them. Production
# gets them through promote_conda_package.yaml, with the GOATS that needs them.
on:
  workflow_dispatch:

env:
  RATTLER_BUILD_VERSION: "0.76.1"
  CHANNEL_ROOT: https://gemini-hlsw.github.io/goats-infra

jobs:
  build:
    # All dependency recipes are noarch: python, so a single Linux build
    # covers every platform.
    name: Build missing packages (noarch)
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.list.outputs.built }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install rattler-build
        run: |
          url=https://github.com/prefix-dev/rattler-build/releases/download/v${RATTLER_BUILD_VERSION}/rattler-build-x86_64-unknown-linux-musl
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/rattler-build" "$url"
          chmod +x "$RUNNER_TEMP/rattler-build"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Our channels go before conda-forge: with strict channel priority they
      # must shadow conda-forge for the packages we override (ipyvuedraggable
      # 1.0.0 there vs. our 1.1.0). --skip-existing all skips any recipe whose
      # exact build is already in one of these channels.
      - name: Build recipes
        run: |
          rattler-build build \
            --recipe-dir dependency-feedstocks/recipes \
            --variant-config dependency-feedstocks/recipes/variants.yaml \
            --skip-existing all \
            --channel "$CHANNEL_ROOT/conda-test" \
            --channel "$CHANNEL_ROOT/conda" \
            --channel conda-forge \
            --output-dir "$RUNNER_TEMP/conda-artifacts"

      - name: List built packages
        id: list
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/conda-artifacts/noarch/*.conda)
          names=$(for f in "${files[@]}"; do basename "$f"; done | sort | paste -sd ' ')
          echo "built=$names" >> "$GITHUB_OUTPUT"
          echo "Built: ${names:-nothing, every package is already published}"

      - name: Upload built artifacts
        if: steps.list.outputs.built != ''
        uses: actions/upload-artifact@v6
        with:
          name: deps-noarch
          path: ${{ runner.temp }}/conda-artifacts/noarch/*.conda

  publish:
    needs: build
    if: needs.build.outputs.built != ''
    name: Publish to conda-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: conda-test
      cancel-in-progress: false
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          name: deps-noarch
          path: ${{ runner.temp }}/built/noarch

      - name: Publish
        uses: ./.github/actions/publish-channel
        with:
          channel: conda-test
          packages: ${{ runner.temp }}/built
          message: "Publish dependency packages: ${{ needs.build.outputs.built }}"
          token: ${{ github.token }}
