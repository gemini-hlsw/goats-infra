schema_version: 1

# gpp-client pre-releases (vYY.M.PATCH.devN) for the conda-dev channel only.
# build_and_publish_conda.yaml builds one only when a dev GOATS pins a .devN
# that conda-dev lacks; it rewrites version and sha256 from PyPI first, so
# the values below are only an example that builds locally.
#
# Stable gpp-client comes from conda-forge; never publish this recipe to
# conda-test or conda: with strict channel priority it would hide every
# conda-forge release (ADR 0002 ties .devN builds to GPP development).

context:
  # Upstream declares requires-python >=3.11.
  python_min: "3.11"
  version: "26.10.4.dev3"

package:
  name: gpp-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gpp-client/gpp_client-${{ version }}.tar.gz
  sha256: cc571081659cc7d7f82095c43f41a77a40a29e2069e738e5b031a013eab5f604

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - gpp = gpp_client.cli.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.13.4
    - beautifulsoup4 >=4.11.0
    - click >=8.3.1
    - graphql-core >=3.2.0
    - httpx >=0.23
    - pydantic >=2.12.0
    - pydantic-settings >=2.13.1
    - typer >=0.21.1
    - websockets >=14.2

tests:
  - python:
      imports:
        - gpp_client
      python_version: ${{ python_min }}.*
      pip_check: true
  - script:
      - gpp --help
      # A .devN build must carry GPP development code (ADR 0002).
      - python -c "from gpp_client.generated.package_environment import PACKAGE_ENVIRONMENT as env; print(env); assert env == 'DEVELOPMENT'"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/gemini-hlsw/gpp-client
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Gemini Program Platform client (development pre-releases).
  repository: https://github.com/gemini-hlsw/gpp-client
  documentation: https://gpp-client.readthedocs.io/

extra:
  recipe-maintainers:
    - miguelgomezgomez
    - davner
