{% set name = "ipysplitpanes" %}
{% set version = "0.2.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3c9b4dcc256b8937c7e614006d43b3de8548aec2de51dae80aa7ceb331d3f664

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - ipyvue >=1.5,<2

test:
  imports:
    - ipysplitpanes
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/nmearl/ipysplitpanes
  summary: IPyWidget wrapper for the SplitPanes Vue package.
  license: MIT
  # The sdist does not ship the license text, so it is vendored in the recipe
  # directory from the upstream repository.
  license_file: LICENSE
  dev_url: https://github.com/nmearl/ipysplitpanes

extra:
  recipe-maintainers:
    - davner
    - soraisam
