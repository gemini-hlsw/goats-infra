{% set name = "jdaviz" %}
{% set version = "5.0.2" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5f9c22262a9069c17cd8310fa55a6a085fb9cda3e042ec42c9b8189569790b5f

build:
  noarch: python
  entry_points:
    - jdaviz = jdaviz.cli:_main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.2
    - setuptools_scm
    - pip
  run:
    - python >={{ python_min }}
    - packaging
    - astropy >=6
    - matplotlib-base >=3.6
    - traitlets >=5.0.5
    - bqplot >=0.12.45,<0.13
    - glue-core >=1.24.0
    - glue-jupyter >=0.27.0
    - echo >=0.11.0
    - ipykernel >=7.1.0
    - ipyvue >=1.6
    - ipyvuetify >=1.7.0,<3.0
    - ipysplitpanes >=0.1.0
    - ipygoldenlayout >=0.3.0
    - ipywidgets >=8.0.6
    - solara >=1.49.0
    - pyyaml >=5.4.1
    - specutils >=2.0.0
    - specreduce >=1.6.0
    - photutils >=2.2
    - glue-astronomy >=0.12.0
    - asteval >=0.9.23
    - idna
    - vispy >=0.6.5
    - asdf >=2.14.3
    - stdatamodels >=1.3
    - gwcs >=0.16.1
    - regions >=0.6
    - scikit-image
    - sidecar >=0.5.2
    - ipypopout >=2.0.1
    - astroquery
    - requests
    - nbclassic
    - pyvo >=1.5.3
    - s3fs >=2024.10.0
    - joblib >=1.3.0
    - ipyvuedraggable >=1.1.0
    - spherical-geometry

test:
  imports:
    - jdaviz
    - jdaviz.configs.specviz
  commands:
    - jdaviz --help
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/spacetelescope/jdaviz
  summary: Astronomical data analysis visualization tools based on the Jupyter platform.
  license: BSD-3-Clause
  license_file: LICENSE.rst
  doc_url: https://jdaviz.readthedocs.io/
  dev_url: https://github.com/spacetelescope/jdaviz

extra:
  recipe-maintainers:
    - davner
    - soraisam
