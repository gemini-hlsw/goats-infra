schema_version: 1

context:
  version: "2.0.1"

package:
  name: ipypopout
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipypopout/ipypopout-${{ version }}.tar.gz
  sha256: 74b5b23e1bf0446313e176f8d18ee5e86c4881cd89011055b4afe15296f00312

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - ipywidgets >=7.7
    - ipyvuetify >=1.7.0,<2

tests:
  - python:
      imports:
        - ipypopout
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/widgetti/ipypopout
  license: MIT
  license_file: LICENSE
  summary: Pop out ipywidgets into a separate browser window.
  description: |
    ipypopout provides a button widget that detaches any ipywidget into its
    own browser window, keeping it synchronised with the originating kernel.
    It is useful for multi-monitor dashboards built with ipyvuetify or solara.
  repository: https://github.com/widgetti/ipypopout

extra:
  recipe-maintainers:
    - miguelgomezgomez
