{% set name = "goats" %}
{% set version = "26.8.0rc3" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/gemini-hlsw/goats/archive/{{ version }}.tar.gz
  sha256: 272aff5c0d7c3b204b3de263bc7d0b0f48f951b52efbf105203a60df3e15c4ca

build:
  entry_points:
    - goats = goats_cli:cli
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true   # [win or arm64]
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - apscheduler >=3.11.2,<4
    - astropy >=7
    - astroquery >=0.4.11
    - channels_redis >=4.3.0,<5
    - channels >=4.0,<5
    - click >=8.3.1,<9
    - django >=5,<6
    - django-cors-headers >=4.9.0,<5
    - django-dramatiq >=0.15.0
    - django-crispy-forms <2.6
    - djangorestframework >=3.16.1,<4
    - dramatiq-abort >=1.2.1
    - dramatiq >=1.18.0,<2
    - marshmallow ==3.26.2
    - marshmallow-jsonapi >=0.24.0
    - numpydoc >=1.9.0,<2
    - tomtoolkit ==2.32.2
    - dragons ==4.2.2
    - redis-server >=7.4.0,<8
    - daphne >=4.2.0,<5
    - watchdog >=6.0.0,<7
    - redis-py >=6.2.0,<7
    - gpp-client ==26.5.0
    - tom-tns >=0.3.4
    - copier >=9.14.1
    - typer >=0.19.2
    - whitenoise >=6.6.0,<7
test:
  imports:
    - goats_tom
    - goats_cli
    - goats_common
  commands:
#    - pip check
    - goats --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/gemini-hlsw/goats
  summary: Gemini Observation and Analysis of Targets System.
  license: CC0-1.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - src/goats_tom/static/fontawesome-free-6.7.2/LICENSE.txt
  doc_url: https://goats.readthedocs.io/en/{{ version }}/
  dev_url: https://github.com/gemini-hlsw/goats

extra:
  recipe-maintainers:
    - davner
    - soraisam
